[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docmost-sdk"
version = "1.0.0"
description = "Python client for the Docmost REST API. Supports API token (Bearer) and email/password (cookie) authentication."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Docmost SDK Contributors" }]
keywords = ["docmost", "wiki", "api", "sdk", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/ggpo1/docmost-sdk"
Repository = "https://github.com/ggpo1/docmost-sdk"
Documentation = "https://github.com/ggpo1/docmost-sdk/tree/main/python"

[tool.hatch.build.targets.wheel]
packages = ["docmost"]

[tool.ruff]
line-length = 100
target-version = "py310"
